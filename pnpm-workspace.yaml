packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  # React
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

  # TanStack
  "@tanstack/react-start": ^1.168.27
  "@tanstack/react-router": ^1.170.17

  # Vite plugins
  "@vitejs/plugin-react": ^6.0.3
  "@tailwindcss/vite": ^4.3.2

  # UI (shadcn / Tailwind)
  "@base-ui/react": ^1.6.0
  class-variance-authority: ^0.7.1
  cnfast: ^0.0.8
  lucide-react: ^1.23.0
  tailwindcss: ^4.3.2
  tw-animate-css: ^1.4.0

  # Server
  nitro: 3.0.260311-beta

  # Tooling
  "@types/node": ^26.1.0
  "@typescript/native-preview": 7.0.0-dev.20260702.3
  bumpp: ^11.1.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.1
  vite-plus: ^0.2.2
  vitest: 4.1.9

catalogMode: prefer

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@types/node": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  # React
  react: ^19.2.6
  react-dom: ^19.2.6
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3

  # TanStack
  "@tanstack/react-start": ^1.168.9
  "@tanstack/react-router": ^1.170.6

  # Vite plugins
  "@vitejs/plugin-react": ^6.0.2
  "@tailwindcss/vite": ^4.3.0

  # UI (shadcn / Tailwind)
  "@base-ui/react": ^1.5.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.16.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  tw-animate-css: ^1.4.0

  # Server
  nitro: 3.0.260311-beta

  # Tooling
  "@types/node": ^25.9.1
  "@typescript/native-preview": 7.0.0-dev.20260521.1
  bumpp: ^11.1.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  # React
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4

  # TanStack
  "@tanstack/react-start": ^1.168.42
  "@tanstack/react-router": ^1.170.25

  # Vite plugins
  "@vitejs/plugin-react": ^6.0.5
  "@tailwindcss/vite": ^4.3.3

  # UI (shadcn / Tailwind)
  "@base-ui/react": ^1.7.0
  class-variance-authority: ^0.7.1
  cnfast: ^0.1.0
  lucide-react: ^1.31.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0

  # Server
  nitro: 3.0.260311-beta

  # Tooling
  "@types/node": ^26.2.0
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  bumpp: ^12.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.1
  vite-plus: ^0.2.8
  vitest: 4.1.10

catalogMode: prefer

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@types/node": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
